services:
  - type: web
    name: binance-ai-trader
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GOOGLE_FORM_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
